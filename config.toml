[global] #Global paramters
run_path = 'sac_ml_opt'    
random_seed = 3407     
max_iteration = 20     
workflow_path = '' 

### 1) Train step ###
[train] 
cutoff = 4     
val_ratio = 0.2     
node_size = 64     
num_interactions = 4     
output_dir = 'model'     
max_steps = 450
batch_size = 16     
initial_lr = 0.0001     
forces_weight = 0.98     
charge_weight = 0.1     
stress_weight = 1000     
log_interval = 1    
dataset = './train_data/sac_training_filtered_train.xyz'
val_dataset = "./train_data/sac_training_filtered_val.xyz"
plateau_scheduler = true    
normalization = true     
atomwise_normalization = true      
stop_patience = 100 

compute_forces = true     
compute_stress = false     
compute_magmom = true    
compute_bader_charge = false     

stop_after_train = false     
load_prev_iter_model = true     

[train.ensemble]

64_node_5_layer  = {node_size = 64,  num_interactions = 5}

96_node_3_layer  = {node_size = 96,  num_interactions = 3}
96_node_5_layer  = {node_size = 96,  num_interactions = 5}

128_node_4_layer = {node_size = 128, num_interactions = 4}
128_node_6_layer = {node_size = 128, num_interactions = 6}

### 2) Simulate step ###
[simulate.optimize] 
opt_steps = 250
opt_fmax = 0.025    
opt_algo = 'BFGS'
opt_cell = false

force_sd_threshold = 0.5
max_force_sd = 1.5

[simulate.runs.opt_batch1]
method = 'optimize'
structure_path = './train_data/unlabeled_data/training_batch1.xyz'

[simulate.runs.opt_batch2]
method = 'optimize'
structure_path = './train_data/unlabeled_data/training_batch2.xyz'

